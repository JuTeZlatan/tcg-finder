// Module natif du scanner (Android) : caméra analysée en direct, lecture du texte (latin, japonais, chinois)
// et empreinte visuelle des cartes.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cardvision'
version = '1.0.0'

android {
  namespace "expo.modules.cardvision"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

// Comme expo-camera : CameraX a besoin du vrai ListenableFuture (Guava le remplace par un jar vide).
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}

dependencies {
  def camerax_version = "1.6.0"
  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "androidx.exifinterface:exifinterface:1.4.2"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
  implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}
